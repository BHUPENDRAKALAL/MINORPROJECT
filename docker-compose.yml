# Local development infrastructure: PostgreSQL, Redis, SeaweedFS (S3-compatible file storage)
# and Mailpit (a fake inbox that catches every email the app sends).
# Start with `pnpm infra:up`. Data is kept in named volumes (outside OneDrive).
name: cyrus

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cyrus
      POSTGRES_PASSWORD: cyrus_dev
      POSTGRES_DB: cyrus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyrus -d cyrus"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Queues (BullMQ) need data kept on restart and no key eviction.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"   # host 6380: this laptop already runs an old Redis on 6379
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # File storage that speaks the S3 API. In production the same code talks to R2, Supabase Storage or S3.
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    ports:
      - "8333:8333"   # S3 API
    volumes:
      - seaweeddata:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Every email the app sends lands here instead of a real inbox. Open http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web inbox

  # Rebuilds uploaded PDFs and images so nothing hidden in them survives (apps/api/src/sanitizer).
  # Locked down on purpose: no secrets, read-only files, not root, no extra powers, small limits.
  # It exits by itself after a short while of work and Docker starts a pristine one.
  sanitizer:
    build:
      context: .
      dockerfile: infra/sanitizer/Dockerfile
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    user: node
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 64
    cpus: 1
    ports:
      # Only this machine can reach it (the worker runs on the host in development).
      # When everything runs in containers, drop the port and put it on an internal-only network.
      - "127.0.0.1:4010:4010"

volumes:
  pgdata:
  redisdata:
  seaweeddata:
